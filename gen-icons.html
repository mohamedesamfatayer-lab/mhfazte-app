<!DOCTYPE html><html><body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function draw(id, size) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const r = size * 0.18;

  // Background rounded rect
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, 0, size, size);
  bg.addColorStop(0, '#1d4ed8');
  bg.addColorStop(1, '#2563eb');
  ctx.fillStyle = bg;
  ctx.fill();

  // Wallet body
  const p = size * 0.12;
  const ww = size - p * 2, wh = size * 0.46;
  const wy = size * 0.37;
  roundRect(ctx, p, wy, ww, wh, size * 0.05);
  const walletG = ctx.createLinearGradient(0, wy, 0, wy + wh);
  walletG.addColorStop(0, '#fbbf24');
  walletG.addColorStop(1, '#d97706');
  ctx.fillStyle = walletG;
  ctx.fill();

  // Wallet flap
  roundRect(ctx, p, size * 0.28, ww, size * 0.14, size * 0.04);
  ctx.fillStyle = '#f59e0b';
  ctx.fill();

  // Coin pocket
  const cx = size * 0.72, cy = size * 0.6, cr = size * 0.11;
  ctx.beginPath();
  ctx.arc(cx, cy, cr, 0, Math.PI * 2);
  ctx.fillStyle = '#1d4ed8';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, cr * 0.72, 0, Math.PI * 2);
  ctx.fillStyle = '#3b82f6';
  ctx.fill();

  // $ sign in pocket
  ctx.font = `bold ${size * 0.09}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('$', cx, cy + size * 0.005);

  // Card lines
  ctx.fillStyle = 'rgba(180,83,9,0.45)';
  roundRect(ctx, p + size * 0.04, size * 0.52, size * 0.37, size * 0.04, size * 0.02);
  ctx.fill();
  roundRect(ctx, p + size * 0.04, size * 0.59, size * 0.26, size * 0.03, size * 0.015);
  ctx.fill();

  const a = document.createElement('a');
  a.download = id.replace('c', 'icon-') + '.png';
  a.href = c.toDataURL('image/png');
  a.textContent = 'Download ' + a.download;
  a.style = 'display:block;margin:8px;font-family:sans-serif;';
  document.body.appendChild(a);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

draw('c192', 192);
draw('c512', 512);
</script></body></html>
